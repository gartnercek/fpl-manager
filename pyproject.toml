[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-manager"
version = "0.1.0"
description = "Advisory Fantasy Premier League manager: xP model, optimizer, weekly email."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "numpy>=2.0",
    "pandas>=2.2",
    "pulp>=2.9,<4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fpl-manager = "fpl_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
