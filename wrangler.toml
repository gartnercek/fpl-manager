# Worker + static assets. Deploy: npx wrangler deploy
# Cloudflare Workers Builds project is fpl-manager2 (not Pages).
name = "fpl-manager2"
main = "worker.js"
compatibility_date = "2025-08-15"
account_id = "4ca0f1d6e68a3390a3aad288ac62a887"
workers_dev = true

[assets]
directory = "site"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[vars]
STRIPE_PRICE_SEASON = "price_1U8lpoAoVac84U9IFNdW9zDc"
STRIPE_PRICE_MONTHLY = "price_1U8lpoAoVac84U9IgSs9qRmz"
STRIPE_SEASON = "2026/27"
SITE_ORIGIN = "https://fpl-manager.com"
PAYMENTS_OPEN = "1"

# Attach the registrar zone to this Worker. Do not add these on Pages.
[[routes]]
pattern = "fpl-manager.com"
custom_domain = true

[[routes]]
pattern = "www.fpl-manager.com"
custom_domain = true

# Free-beta emails + FPL team IDs. Create with:
#   npx wrangler kv namespace create BETA_SIGNUPS
# then paste the id here and redeploy. Without it, join returns an error.
# [[kv_namespaces]]
# binding = "BETA_SIGNUPS"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
