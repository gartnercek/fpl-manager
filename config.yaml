# Public FPL team ID (from the URL: fantasy.premierleague.com/entry/<id>/).
# GitHub Actions can override this with repository variable FPL_TEAM_ID.
team_id: 4846735

# One-off free-transfer top-ups FPL announces (2025/26: everyone was topped up to 5 at GW16
# for AFCON). Format {gw: n}. Free transfers are otherwise rebuilt from your public history.
ft_topups: {}

# Expected-points model (defaults live in src/fpl_manager/projection.py:ProjectionConfig).
# Every knob here was checked on 2025/26 and replayed on 2026/27 with python -m fpl_manager.backtest.
projection:
  rate_half_life: 12        # player matches; per-90 xG/xA/bonus/DEFCON recency weighting
  prev_weight: 0.35         # each last-season 90 minutes counts this much (capped at 30 x 90)
  prev_half_life: 12        # last season fades by half every 12 matches of this season
  prior_90s: 4.0            # position/price prior strength
  minutes_decay: 0.65       # start/cameo rates: weight of the match before the latest
  team_half_life: 14        # team xG ratings recency (matches)
  team_prior_matches: 8     # last season's ratings count as this many matches

# Multi-week planner (defaults in src/fpl_manager/planner.py:PlannerConfig).
planner:
  horizon: 6                # GWs the transfer plan looks ahead
  transfer_weeks: 2         # transfers are planned in the first two of them
  decay: 0.84               # weight of week k = decay**k
  ft_value: 1.6             # value of a banked free transfer at the end of the plan
  hit_cost: 4.0
  transfer_friction: 0.4    # each move must beat the projection noise by this much
  time_limit: 60            # seconds per MIP solve

# Polymarket EPL team totals (O/U 0.5) -> P(team scores 0). Public Gamma API; no key.
# Blended into this GW's goal rates when the book is liquid. Not backtestable (no odds history).
markets:
  enabled: true
  blend: 0.7
  min_liquidity: 80
  full_liquidity: 800

email:
  timezone: Europe/Ljubljana
  smtp_host: smtp.gmail.com
  smtp_port: 587
  # SMTP_USER, SMTP_PASSWORD, EMAIL_TO come from environment / GitHub secrets.

schedule:
  email_within_hours: 60
  delta_within_hours: 24
